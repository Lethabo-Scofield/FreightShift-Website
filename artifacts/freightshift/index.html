<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E5FB1" />

    <title>FreightShift International Logistics — China to South Africa Freight Forwarding</title>
    <meta name="description" content="South African freight forwarder specialising in the China to South Africa trade corridor. Sea, air and door-to-door logistics with full SARS customs clearance." />
    <meta name="keywords" content="freight forwarding South Africa, China South Africa logistics, sea freight, air freight, customs clearance, SARS, Shenzhen Johannesburg, Durban port" />
    <meta name="author" content="FreightShift International Logistics" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://freightshiftlogistics.co.za/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreightShift International Logistics" />
    <meta property="og:title" content="FreightShift International Logistics" />
    <meta property="og:description" content="China to South Africa freight forwarding. Reliable sea & air freight, SARS customs clearance, door-to-door delivery." />
    <meta property="og:url" content="https://freightshiftlogistics.co.za/" />
    <meta property="og:image" content="https://freightshiftlogistics.co.za/opengraph.jpg" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreightShift International Logistics" />
    <meta name="twitter:description" content="China to South Africa freight forwarding. Reliable sea & air freight, SARS customs clearance, door-to-door delivery." />
    <meta name="twitter:image" content="https://freightshiftlogistics.co.za/opengraph.jpg" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Organization JSON-LD (baseline; per-page Seo component injects more) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FreightShift International Logistics",
      "alternateName": "FreightShift",
      "url": "https://freightshiftlogistics.co.za",
      "logo": "https://freightshiftlogistics.co.za/favicon.png",
      "email": "info@freightshiftlogistics.co.za",
      "telephone": "+27 68 109 5543",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Johannesburg",
        "addressRegion": "Gauteng",
        "addressCountry": "ZA"
      },
      "sameAs": ["https://wa.me/message/EVTMLWYQY2OCG1"]
    }
    </script>

    <!-- Initial brand splash loader (removed once React mounts) -->
    <style>
      .fs-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#f5f4ef;z-index:9999;}
      .fs-splash-logo{width:220px;max-width:60vw;height:auto;animation:fsFade 1s ease-in-out infinite alternate;}
      .fs-splash-bar{width:160px;max-width:50vw;height:4px;background:rgba(10,15,24,0.1);overflow:hidden;}
      .fs-splash-bar span{display:block;width:40%;height:100%;background:#ff4a00;animation:fsSlide 1.1s ease-in-out infinite;}
      @keyframes fsSlide{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
      @keyframes fsFade{0%{opacity:0.55;}100%{opacity:1;}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fs-splash">
        <img src="/fsl-logo.png" alt="FreightShift International Logistics" class="fs-splash-logo" />
        <div class="fs-splash-bar"><span></span></div>
      </div>
    </div>
    <noscript>
      FreightShift International Logistics — China to South Africa freight forwarding. Please enable JavaScript to use our site, or contact us at info@freightshiftlogistics.co.za / +27 68 109 5543.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
