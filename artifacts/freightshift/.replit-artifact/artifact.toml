kind = "web"
previewPath = "/"
title = "FreightShift International Logistics"
version = "1.0.0"
id = "artifacts/freightshift"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21403

[services.development]
run = "pnpm --filter @workspace/freightshift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freightshift", "run", "build" ]
publicDir = "artifacts/freightshift/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21403"
BASE_PATH = "/"
